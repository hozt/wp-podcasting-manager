name: Build release zip

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check plugin version matches release tag
        if: github.event_name == 'release'
        run: |
          VERSION=$(grep -m1 -iE '^\s*\*\s*Version:' podcasting-manager.php | sed -E 's/.*Version:\s*//; s/\s+$//')
          TAG="${GITHUB_REF_NAME#v}"
          echo "Plugin header version: $VERSION, release tag: $TAG"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::Version in podcasting-manager.php ($VERSION) does not match release tag ($GITHUB_REF_NAME)"
            exit 1
          fi

      - name: Lint PHP
        run: find . -name '*.php' -not -path './.git/*' -not -path './vendor/*' -not -path './build/*' -print0 | xargs -0 -n1 php -l

      - name: Build zip
        run: |
          mkdir -p build/podcasting-manager
          rsync -a --exclude='.git' --exclude='.github' --exclude='build' \
            --exclude='*.zip' --exclude='.DS_Store' --exclude='.gitignore' \
            --exclude='.gitattributes' --exclude='.code-review' --exclude='.claude' \
            --exclude='tests' --exclude='phpunit.xml*' \
            --exclude='vendor' --exclude='composer.json' --exclude='composer.lock' \
            --exclude='.phpunit.result.cache' \
            ./ build/podcasting-manager/
          cd build
          zip -r ../podcasting-manager.zip podcasting-manager

      - name: Upload zip to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" podcasting-manager.zip --clobber

      - name: Keep zip as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: podcasting-manager
          path: podcasting-manager.zip
